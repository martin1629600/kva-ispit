<mat-toolbar>
  <span>Prodavnica igracaka</span>
  <span class="spacer"></span>
  <a routerLink="/" matButton="">Home <mat-icon fontIcon="home"></mat-icon></a>
  @if (service.getActiveUser()) {
    <a routerLink="/cart" matButton="">Cart <mat-icon fontIcon="shopping_cart"></mat-icon> </a>
    <button matButton [matMenuTriggerFor]="afterMenu">
      Korisnik
      <mat-icon fontIcon="account_circle"></mat-icon>
    </button>
    <mat-menu #afterMenu="matMenu" xPosition="after">
      <button mat-menu-item routerLink="/user">View profile</button>
      <button mat-menu-item (click)="doLogout()">Logout</button>
    </mat-menu>
  } @else {
    <a routerLink="/login" matButton="">Login<mat-icon fontIcon="login"></mat-icon></a>
    <a routerLink="/register" matButton=""
      >Register<mat-icon fontIcon="app_registration"></mat-icon
    ></a>
  }
</mat-toolbar>
<div class="wrapper">
  <router-outlet />
</div>
