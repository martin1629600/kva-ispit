@if (toyTypes()) {
  <div class="user-wrapper">
    <mat-card class="account-card">
      <mat-card-header class="account-header">
        <h1>Account details</h1>
      </mat-card-header>
      <mat-card-content>
        <div class="account-fields">
          <mat-form-field>
            <mat-label>Email</mat-label>
            <input matInput type="email" [(ngModel)]="activeUser!.email" disabled="" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>Ime</mat-label>
            <input matInput type="text" [(ngModel)]="activeUser!.ime" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>Prezime</mat-label>
            <input matInput type="text" [(ngModel)]="activeUser!.prezime" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>Telefon</mat-label>
            <input matInput type="text" [(ngModel)]="activeUser!.telefon" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>Adresa</mat-label>
            <input matInput type="text" [(ngModel)]="activeUser!.adresa" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>Omiljena igracka</mat-label>
            <mat-select [(ngModel)]="activeUser!.igracka">
              @for (t of toyTypes(); track t) {
                <mat-option [value]="t.name">{{ t.name }}</mat-option>
              }
            </mat-select>
          </mat-form-field>
          <mat-form-field>
            <mat-label>Password</mat-label>
            <input matInput type="password" [(ngModel)]="activeUser!.password" />
          </mat-form-field>
        </div>
      </mat-card-content>
      <mat-card-actions>
        <button type="button" matButton (click)="updateUser()">
          <mat-icon fontIcon="check"></mat-icon> Save
        </button>
      </mat-card-actions>
    </mat-card>

    <mat-card class="account-card">
      <mat-card-header class="account-header">
        <h1>Change password</h1>
      </mat-card-header>
      <mat-card-content>
        <div class="account-fields">
          <mat-form-field>
            <mat-label>Old Password</mat-label>
            <input matInput type="password" [(ngModel)]="oldPassword" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>New password</mat-label>
            <input matInput type="password" [(ngModel)]="newPassword" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>Password repeat</mat-label>
            <input matInput type="password" [(ngModel)]="passRepeat" />
          </mat-form-field>
        </div>
      </mat-card-content>
      <mat-card-actions>
        <button type="button" matButton (click)="updatePassword()">
          <mat-icon fontIcon="password"></mat-icon> Update password
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
} @else {
  <app-loading></app-loading>
}
